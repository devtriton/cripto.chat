<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background: rounded square with brand gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c4a35a"/>
      <stop offset="100%" style="stop-color:#a88b4a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Lock body (main symbol) -->
  <g transform="translate(128, 96)">
    <!-- Shackle -->
    <path d="M128 48c-35.3 0-64 28.7-64 64v192c0 35.3 28.7 64 64 64h64c35.3 0 64-28.7 64-64V112c0-35.3-28.7-64-64-64H128z" fill="#f5f0e8"/>
    <!-- Inner shackle cutout -->
    <path d="M160 48c-17.7 0-32 14.3-32 32v192c0 17.7 14.3 32 32 32h64c17.7 0 32-14.3 32-32V80c0-17.7-14.3-32-32-32H160z" fill="url(#bgGrad)"/>
    <!-- Keyhole -->
    <circle cx="192" cy="224" r="16" fill="#2d2d2d"/>
    <rect x="188" y="240" width="8" height="32" rx="4" fill="#2d2d2d"/>
  </g>
  
  <!-- Chat bubbles (small, decorative) -->
  <g opacity="0.15" fill="#f5f0e8">
    <path d="M380 360c0 11-9 20-20 20h-40l-15 15v-15h-50c-11 0-20-9-20-20V240c0-11 9-20 20-20h100c11 0 20 9 20 20v120z"/>
    <path d="M420 400c0 11-9 20-20 20h-30l-12 12v-12h-20c-11 0-20-9-20-20V300c0-11 9-20 20-20h40c11 0 20 9 20 20v100z"/>
  </g>
  
  <!-- Small lock icon in corner (brand mark) -->
  <g transform="translate(360, 360)">
    <path d="M32 0c-17.7 0-32 14.3-32 32v64c0 17.7 14.3 32 32 32h32c17.7 0 32-14.3 32-32V32c0-17.7-14.3-32-32-32H32z" fill="#f5f0e8" opacity="0.9"/>
    <path d="M48 0c-8.8 0-16 7.2-16 16v64c0 8.8 7.2 16 16 16h16c8.8 0 16-7.2 16-16V16c0-8.8-7.2-16-16-16H48z" fill="url(#bgGrad)"/>
    <circle cx="56" cy="44" r="6" fill="#2d2d2d" opacity="0.8"/>
    <rect x="54" y="50" width="4" height="16" rx="2" fill="#2d2d2d" opacity="0.8"/>
  </g>
  
  <!-- "cripto" wordmark (small) -->
  <text x="256" y="460" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#f5f0e8" opacity="0.9">cripto.chat</text>
</svg>